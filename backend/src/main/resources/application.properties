spring.application.name=pm-backend
server.port=8000

# Local runs read OPENROUTER_API_KEY from the project-root .env; Docker passes it as an env var.
spring.config.import=optional:file:../.env[.properties]

app.database-path=${DATABASE_PATH:../data/kanban.sqlite3}
app.static-dir=${STATIC_DIR:../frontend/out}
spring.web.resources.static-locations=file:${app.static-dir}/

# In-memory sessions: restarting the backend signs everyone out (local MVP only).
server.servlet.session.timeout=14d
server.servlet.session.cookie.max-age=14d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
